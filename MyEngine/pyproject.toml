[project]
name = "viper-pygame-engine"
version = "0.1.0"
description = "A lightweight Python game engine with a node-based scene system"
requires-python = ">=3.10"
dependencies = ["pygame-ce"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "Renderer*"]